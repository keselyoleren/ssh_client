# Throw-away servers used by src-tauri/tests/e2e.rs.
#   docker compose -f tests/servers/docker-compose.yml up -d --wait
name: kshell-test

services:
  ssh:
    container_name: kshell-ssh
    image: lscr.io/linuxserver/openssh-server:latest
    environment:
      PASSWORD_ACCESS: "true"
      USER_NAME: tester
      USER_PASSWORD: secret
      DOCKER_MODS: linuxserver/mods:openssh-server-ssh-tunnel   # enables TCP forwarding
    ports: ["2222:2222"]
    healthcheck: { test: ["CMD", "nc", "-z", "localhost", "2222"], interval: 3s, retries: 40 }

  # Only reachable through `ssh` — used to test jump hosts and -L forwarding.
  ssh2:
    container_name: kshell-ssh2
    image: lscr.io/linuxserver/openssh-server:latest
    environment:
      PASSWORD_ACCESS: "true"
      USER_NAME: inner
      USER_PASSWORD: inner
    healthcheck: { test: ["CMD", "nc", "-z", "localhost", "2222"], interval: 3s, retries: 40 }

  ftp:
    container_name: kshell-ftp
    image: delfer/alpine-ftp-server
    environment:
      USERS: "ftpuser|ftppass"
      ADDRESS: 127.0.0.1
    ports: ["2121:21", "21000-21010:21000-21010"]

  # S3-compatible server (RustFS). MinIO no longer publishes free container images.
  s3:
    container_name: kshell-s3
    image: rustfs/rustfs
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports: ["9000:9000"]

  # Azure Blob Storage emulator (Microsoft). Account: devstoreaccount1 (well-known dev key).
  azurite:
    container_name: kshell-azurite
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
    ports: ["10000:10000"]

  # Google Cloud Storage emulator.
  fake-gcs:
    container_name: kshell-fake-gcs
    image: fsouza/fake-gcs-server
    command: -scheme http -port 4443 -public-host 127.0.0.1:4443 -backend memory
    ports: ["4443:4443"]
