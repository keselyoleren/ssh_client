name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run build

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      # tauri::generate_context! needs the frontend dist folder to exist
      - run: mkdir -p dist && echo '<html></html>' > dist/index.html
        shell: bash
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  e2e:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev
      - run: mkdir -p dist && echo '<html></html>' > dist/index.html
      # Registries (Docker Hub, lscr.io, mcr) sometimes answer "toomanyrequests"; retry the pull with a backoff
      # so a rate limit doesn't fail the run before any test has started.
      - name: Pull test server images
        run: |
          for i in 1 2 3 4; do
            docker compose -f tests/servers/docker-compose.yml pull --quiet && exit 0
            echo "Pull failed (attempt $i/4), retrying in $((i * 20))s"
            sleep $((i * 20))
          done
          exit 1
      - run: docker compose -f tests/servers/docker-compose.yml up -d --wait
      - run: cargo test --test e2e -- --ignored --nocapture
        working-directory: src-tauri
      - run: cargo test --test object_storage -- --ignored --nocapture
        working-directory: src-tauri
      - name: Test server logs
        if: failure()
        run: docker compose -f tests/servers/docker-compose.yml logs --no-color --tail 80
      - if: always()
        run: docker compose -f tests/servers/docker-compose.yml down
